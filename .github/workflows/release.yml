# SPDX-License-Identifier: BSD-2-Clause
# The git tag is the release (SwiftPM resolves tags directly; the Swift
# Package Index picks the tag up). This workflow re-runs CI on the tag,
# attests a source archive's provenance, and creates the GitHub release with
# the changelog section.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test the tag
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the SDK version
        env:
          TAG: ${{ github.ref_name }}
        run: grep -q "static let sdk = \"${TAG#v}\"" Sources/EnsembleWeather/Client/Configuration.swift
      - run: swift format lint --strict --recursive Sources Tests examples Package.swift
      - run: scripts/check-unsafe-swift
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test
      - run: scripts/run-examples

  release:
    name: GitHub release with provenance
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source archive and SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="ensemble-weather-swift-${TAG#v}/" -o "ensemble-weather-swift-${TAG#v}.tar.gz" "$TAG"
          cat > sbom.spdx.json <<JSON
          {"spdxVersion":"SPDX-2.3","dataLicense":"CC0-1.0","SPDXID":"SPDXRef-DOCUMENT",
           "name":"ensemble-weather-swift-${TAG#v}","documentNamespace":"https://github.com/${GITHUB_REPOSITORY}/releases/${TAG}",
           "creationInfo":{"created":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","creators":["Tool: release.yml"]},
           "packages":[{"name":"EnsembleWeather","SPDXID":"SPDXRef-EnsembleWeather","versionInfo":"${TAG#v}",
             "downloadLocation":"https://github.com/${GITHUB_REPOSITORY}","licenseConcluded":"BSD-2-Clause",
             "licenseDeclared":"BSD-2-Clause","copyrightText":"Copyright (c) 2026 Ourea Technologies"}]}
          JSON
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ensemble-weather-swift-*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            ensemble-weather-swift-*.tar.gz sbom.spdx.json
